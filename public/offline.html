<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — 1 social</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        max-width: 400px;
        padding: 32px 24px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #1e293b;
        border-radius: 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .logo-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 100%);
        color: white;
        font-size: 32px;
        font-weight: 900;
        border-radius: 20px;
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 8px 0;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 0 24px 0;
      }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-badge">1</div>
      <h1>You're currently offline</h1>
      <p>1 social is ready, but your internet connection appears to be lost. Please check your network to resume real-time messages and calls.</p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
